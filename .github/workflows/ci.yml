name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep PEP 517 source installs aligned with the all-feature release wheels.
  MATURIN_PEP517_ARGS: "--all-features"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (source)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build & install (source, all features) + test deps
        run: pip install ".[test]"
      - name: Verify all feature APIs
        run: python -c "import lkrequest; required = ('QuicProfile', 'Layers', 'NegotiabilityFloor'); missing = [name for name in required if not hasattr(lkrequest, name)]; assert not missing, f'missing all-feature APIs:{missing}'"
      - name: Run tests
        run: pytest tests/ -v

  build-wheels:
    name: Wheel · ${{ matrix.target }}
    needs: [test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            manylinux: "2_28"
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            manylinux: "auto"
          - target: aarch64-apple-darwin
            runner: macos-15
            manylinux: "auto"
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            manylinux: "auto"
    steps:
      - uses: actions/checkout@v4
      - name: Set up NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --strip --all-features --out dist
          sccache: "true"
          before-script-linux: |
            dnf install -y cmake perl clang || yum install -y cmake perl clang
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: sdist
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test-wheel:
    name: Test wheel · ${{ matrix.os }} · py${{ matrix.python }}
    needs: [build-wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wheel: wheel-x86_64-unknown-linux-gnu
            python: "3.9"
          - os: ubuntu-latest
            wheel: wheel-x86_64-unknown-linux-gnu
            python: "3.12"
          - os: windows-latest
            wheel: wheel-x86_64-pc-windows-msvc
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.wheel }}
          path: dist
      - name: Install wheel + test deps
        shell: bash
        run: pip install "$(ls dist/*.whl)[test]"
      - name: Verify all feature APIs
        run: python -c "import lkrequest; required = ('QuicProfile', 'Layers', 'NegotiabilityFloor'); missing = [name for name in required if not hasattr(lkrequest, name)]; assert not missing, f'missing all-feature APIs:{missing}'"
      - name: Run tests
        run: pytest tests/ -v

  release-assets:
    name: Upload to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-wheel, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-wheel, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: lkrequest-py
      url: https://pypi.org/project/lkrequest/
    permissions:
      id-token: write
    steps:
      # Only the release artifacts — anything else added to this workflow later
      # would otherwise land in dist/ and be rejected as an invalid package.
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
